<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comparar transcrição — Aula Global</title><link rel="stylesheet" href="style.css"><body><section class="lobby asr-comparison"><div class="lobbycard"><h1>Comparar transcrição</h1><p>Whisper large-v3-turbo no seu dispositivo. Experimental. O arquivo de áudio não é enviado à plataforma nem salvo.</p><p>Selecione um WAV com sua fala e escreva a referência para medir os erros. A preparação baixa o modelo e verifica uma amostra sintética conhecida.</p><button id="prepare">Preparar reconhecimento</button><button id="cancelPrepare" hidden>Cancelar preparação</button><p id="status" role="status"></p><label>Idioma<select id="language"><option value="pt">Português</option><option value="zh">Mandarim</option><option value="en">Inglês</option><option value="es">Espanhol</option></select></label><label>Áudio WAV<input id="audio" type="file" accept="audio/wav,.wav"></label><label>Texto de referência<textarea id="reference" placeholder="O que foi falado no áudio"></textarea></label><button id="run" disabled>Transcrever e comparar</button><pre id="result" style="white-space:pre-wrap"></pre><button id="save" hidden>Baixar resultado em JSON</button><p><a href="/">Voltar à aula</a></p></div></section><script src="asr-utils.js"></script><script src="device-asr.js"></script><script src="asr-compare.js"></script></body></html>
